<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 270" width="1170" height="270"><style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.t{font-size:22px;font-weight:700;fill:#1f2a44}.n{font-size:14px;font-weight:700;fill:#fff;text-anchor:middle}
.s{font-size:11px;fill:#e8eefc;text-anchor:middle}.e{font-size:12px;font-weight:600;fill:#d64545;text-anchor:middle}
.l{font-size:10.5px;fill:#6b7280;text-anchor:middle}.h{font-size:13px;font-weight:700;fill:#fff}.f{font-size:12px;fill:#1f2a44}
.node{animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,14%,100%{opacity:.9}7%{opacity:1;filter:drop-shadow(0 0 7px rgba(59,111,212,.9))}}
.flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-12}}</style><defs><marker id="xa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="1170" height="270" rx="16" fill="#f7f9fe" stroke="#d5dbe8"/><text x="24" y="38" class="t">expense-tracker.py – animated program flow</text><path id="xe0" d="M182,152.0 L216,152.0" fill="none" stroke="#6b7280" stroke-width="2" class="flow" marker-end="url(#xa)"/><circle r="5.5" fill="#f08a24" opacity="0"><set attributeName="opacity" to="1" begin="0.0s"/><animateMotion dur="2.2s" begin="0.0s" repeatCount="indefinite"><mpath href="#xe0"/></animateMotion></circle><path id="xe1" d="M372,152.0 L406,152.0" fill="none" stroke="#6b7280" stroke-width="2" class="flow" marker-end="url(#xa)"/><circle r="5.5" fill="#f08a24" opacity="0"><set attributeName="opacity" to="1" begin="0.5s"/><animateMotion dur="2.2s" begin="0.5s" repeatCount="indefinite"><mpath href="#xe1"/></animateMotion></circle><path id="xe2" d="M562,152.0 L596,152.0" fill="none" stroke="#6b7280" stroke-width="2" class="flow" marker-end="url(#xa)"/><circle r="5.5" fill="#f08a24" opacity="0"><set attributeName="opacity" to="1" begin="1.0s"/><animateMotion dur="2.2s" begin="1.0s" repeatCount="indefinite"><mpath href="#xe2"/></animateMotion></circle><path id="xe3" d="M752,152.0 L786,152.0" fill="none" stroke="#6b7280" stroke-width="2" class="flow" marker-end="url(#xa)"/><circle r="5.5" fill="#f08a24" opacity="0"><set attributeName="opacity" to="1" begin="1.5s"/><animateMotion dur="2.2s" begin="1.5s" repeatCount="indefinite"><mpath href="#xe3"/></animateMotion></circle><path id="xe4" d="M942,152.0 L976,152.0" fill="none" stroke="#6b7280" stroke-width="2" class="flow" marker-end="url(#xa)"/><circle r="5.5" fill="#f08a24" opacity="0"><set attributeName="opacity" to="1" begin="2.0s"/><animateMotion dur="2.2s" begin="2.0s" repeatCount="indefinite"><mpath href="#xe4"/></animateMotion></circle><path id="xe50" d="M675.0,108 L675.0,82 L485.0,82 L485.0,106" fill="none" stroke="#d64545" stroke-width="2" class="flow" marker-end="url(#xa)"/><circle r="5.5" fill="#f08a24" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite"><mpath href="#xe50"/></animateMotion></circle><text x="580.0" y="74" class="e">retry until valid</text><g class="node" style="animation-delay:0s"><rect x="30" y="110" width="150" height="84" rx="12" fill="#1f2a44"/><text x="105.0" y="140" class="n">Start</text><text x="105.0" y="160" class="s">load</text><text x="105.0" y="174" class="s">expenses.csv</text></g><g class="node" style="animation-delay:1s"><rect x="220" y="110" width="150" height="84" rx="12" fill="#3b6fd4"/><text x="295.0" y="140" class="n">Menu</text><text x="295.0" y="160" class="s">1 Add 2 Show</text><text x="295.0" y="174" class="s">3 Totals 4 Exit</text></g><g class="node" style="animation-delay:2s"><rect x="410" y="110" width="150" height="84" rx="12" fill="#1aa6a6"/><text x="485.0" y="140" class="n">Add New Expense</text><text x="485.0" y="160" class="s">date, item,</text><text x="485.0" y="174" class="s">category, amount</text></g><g class="node" style="animation-delay:3s"><rect x="600" y="110" width="150" height="84" rx="12" fill="#f08a24"/><text x="675.0" y="140" class="n">Validate</text><text x="675.0" y="160" class="s">float(amount)</text><text x="675.0" y="174" class="s">positive number?</text></g><g class="node" style="animation-delay:4s"><rect x="790" y="110" width="150" height="84" rx="12" fill="#2e9e5b"/><text x="865.0" y="140" class="n">Save</text><text x="865.0" y="160" class="s">write rows to</text><text x="865.0" y="174" class="s">expenses.csv</text></g><g class="node" style="animation-delay:5s"><rect x="980" y="110" width="150" height="84" rx="12" fill="#1aa6a6"/><text x="1055.0" y="140" class="n">Reports</text><text x="1055.0" y="160" class="s">set of categories</text><text x="1055.0" y="174" class="s">+ totals</text></g><text x="105.0" y="220" class="e">FileNotFoundError</text><text x="105.0" y="235" class="e">start empty</text><text x="675.0" y="220" class="e">ValueError</text><text x="675.0" y="235" class="e">ask again</text></svg>