<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"><style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.t{font-size:22px;font-weight:700;fill:#1f2a44}.n{font-size:14px;font-weight:700;fill:#fff;text-anchor:middle}
.s{font-size:11px;fill:#e8eefc;text-anchor:middle}.e{font-size:12px;font-weight:600;fill:#d64545;text-anchor:middle}
.l{font-size:10.5px;fill:#6b7280;text-anchor:middle}.h{font-size:13px;font-weight:700;fill:#fff}.f{font-size:12px;fill:#1f2a44}
.node{animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,14%,100%{opacity:.9}7%{opacity:1;filter:drop-shadow(0 0 7px rgba(59,111,212,.9))}}
.flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-12}}</style><defs><marker id="za" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="1000" height="470" rx="16" fill="#f7f9fe" stroke="#d5dbe8"/><text x="24" y="38" class="t">Data model – how the data moves</text><g class="node" style="animation-delay:0s"><rect x="40" y="70" width="240" height="110" rx="10" fill="#fff" stroke="#6b7280" stroke-width="2"/><path d="M40,102 L40,80 Q40,70 50,70 L270,70 Q280,70 280,80 L280,102 Z" fill="#6b7280"/><text x="52" y="91" class="h">FILE  expenses.csv</text><text x="54" y="122" class="f">date,item,category,amount</text><text x="54" y="148" class="f">loaded on start</text><text x="54" y="174" class="f">saved after each add</text></g><g class="node" style="animation-delay:0s"><rect x="370" y="70" width="240" height="110" rx="10" fill="#fff" stroke="#1aa6a6" stroke-width="2"/><path d="M370,102 L370,80 Q370,70 380,70 L600,70 Q610,70 610,80 L610,102 Z" fill="#1aa6a6"/><text x="382" y="91" class="h">EXPENSE  (record)</text><text x="384" y="122" class="f">date  (YYYY-MM-DD)</text><text x="384" y="148" class="f">item, category</text><text x="384" y="174" class="f">amount  (float)</text></g><g class="node" style="animation-delay:0s"><rect x="700" y="70" width="240" height="110" rx="10" fill="#fff" stroke="#3b6fd4" stroke-width="2"/><path d="M700,102 L700,80 Q700,70 710,70 L930,70 Q940,70 940,80 L940,102 Z" fill="#3b6fd4"/><text x="712" y="91" class="h">CATEGORY  (set)</text><text x="714" y="122" class="f">{Stationery, Utilities,</text><text x="714" y="148" class="f"> Refreshments, Transport}</text><text x="714" y="174" class="f">unique values only</text></g><path id="ze0" d="M282,132 L365,132" fill="none" stroke="#6b7280" stroke-width="2" class="flow" marker-end="url(#za)"/><circle r="5.5" fill="#f08a24" opacity="0"><set attributeName="opacity" to="1" begin="0.0s"/><animateMotion dur="2.2s" begin="0.0s" repeatCount="indefinite"><mpath href="#ze0"/></animateMotion></circle><text x="323.5" y="123" class="l">load / save</text><path id="ze1" d="M612,132 L695,132" fill="none" stroke="#6b7280" stroke-width="2" class="flow" marker-end="url(#za)"/><circle r="5.5" fill="#f08a24" opacity="0"><set attributeName="opacity" to="1" begin="0.7s"/><animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite"><mpath href="#ze1"/></animateMotion></circle><text x="653.5" y="123" class="l">category</text><g class="node" style="animation-delay:0s"><rect x="40" y="275" width="240" height="110" rx="10" fill="#fff" stroke="#6b7280" stroke-width="2"/><path d="M40,307 L40,285 Q40,275 50,275 L270,275 Q280,275 280,285 L280,307 Z" fill="#6b7280"/><text x="52" y="296" class="h">FILE  attendance.txt</text><text x="54" y="327" class="f">one name per line</text><text x="54" y="353" class="f">repeats + extra spaces</text><text x="54" y="379" class="f">mixed capitalisation</text></g><g class="node" style="animation-delay:0s"><rect x="370" y="275" width="240" height="110" rx="10" fill="#fff" stroke="#1aa6a6" stroke-width="2"/><path d="M370,307 L370,285 Q370,275 380,275 L600,275 Q610,275 610,285 L610,307 Z" fill="#1aa6a6"/><text x="382" y="296" class="h">STUDENT  (set)</text><text x="384" y="327" class="f">strip() + title()</text><text x="384" y="353" class="f">set() removes duplicates</text><text x="384" y="379" class="f">sorted() A-Z</text></g><g class="node" style="animation-delay:0s"><rect x="700" y="275" width="240" height="110" rx="10" fill="#fff" stroke="#2e9e5b" stroke-width="2"/><path d="M700,307 L700,285 Q700,275 710,275 L930,275 Q940,275 940,285 L940,307 Z" fill="#2e9e5b"/><text x="712" y="296" class="h">FILE  attendance-clean.csv</text><text x="714" y="327" class="f">name</text><text x="714" y="353" class="f">unique, sorted list</text><text x="714" y="379" class="f">one student per row</text></g><path id="ze2" d="M282,337 L365,337" fill="none" stroke="#6b7280" stroke-width="2" class="flow" marker-end="url(#za)"/><circle r="5.5" fill="#f08a24" opacity="0"><set attributeName="opacity" to="1" begin="0.0s"/><animateMotion dur="2.2s" begin="0.0s" repeatCount="indefinite"><mpath href="#ze2"/></animateMotion></circle><text x="323.5" y="328" class="l">clean + set</text><path id="ze3" d="M612,337 L695,337" fill="none" stroke="#6b7280" stroke-width="2" class="flow" marker-end="url(#za)"/><circle r="5.5" fill="#f08a24" opacity="0"><set attributeName="opacity" to="1" begin="0.7s"/><animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite"><mpath href="#ze3"/></animateMotion></circle><text x="653.5" y="328" class="l">sorted CSV</text></svg>